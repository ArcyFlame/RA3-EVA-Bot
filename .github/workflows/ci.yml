name: Bot checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm rebuild better-sqlite3 canvas --ignore-scripts=false
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - name: Install optional Discord testing MCP
        working-directory: tools/discord-test-mcp
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit Discord testing MCP
        working-directory: tools/discord-test-mcp
        run: npm audit --audit-level=low
      - name: Test Discord MCP protocol and safeguards
        working-directory: tools/discord-test-mcp
        run: npm test
      - name: Run network-blocked Discord component suite
        run: >-
          node --input-type=module -e "import {runOfflineTests} from './tools/discord-test-mcp/runner.mjs'; const result = await runOfflineTests('components'); console.log(JSON.stringify(result)); process.exitCode = result.success ? 0 : 1;"
