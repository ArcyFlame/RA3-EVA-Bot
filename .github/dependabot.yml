version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      compatible-libraries:
        patterns: ['*']
        update-types: [minor, patch]
      security-fixes:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: npm
    directory: /tools/discord-test-mcp
    schedule:
      interval: daily
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      compatible-testing-libraries:
        patterns: ['*']
        update-types: [minor, patch]
      testing-security-fixes:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
